app: app-2f36660140594f478e81
source:
  repo: https://github.com/gumtiket/todo-test-ai
  commit: 653e937194eaf832f7f76b9eb63e82f5ce0113c7
build:
  dockerfile: Dockerfile
  runtime_hint: python3.12
port: 8080
healthcheck: /healthz
ingress: public
env:
- name: LOG_LEVEL
  secret: false
  generate: false
  value: INFO
- name: SECRET_KEY
  secret: true
  generate: false
backing_services: []
workload:
  type: request-driven
  scale_to_zero: true
  max_request_seconds: 10
  websocket: false
processes:
  web:
    instances: 1
profile: dev
